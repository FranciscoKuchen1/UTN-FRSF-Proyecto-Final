{
  "version": 1,
  "formatters": {
    "json": {
      "format": "{\"timestamp\": \"%(asctime)s\", \"level\": \"%(levelname)s\", \"module\": \"%(name)s\", \"message\": \"%(message)s\"}"
    }
  },
  "handlers": {
    "file": {
      "class": "logging.FileHandler",
      "filename": "/var/log/guardian/guardian.log",
      "formatter": "json"
    }
  },
  "root": {
    "level": "INFO",
    "handlers": ["file"]
  }
}
