[detector]
window_seconds = 10
entropy_threshold = 7.5
write_count_threshold = 50
rename_count_threshold = 10
block_threshold = 0.8
warn_threshold = 0.5

[canary]
count = 5
deploy_path = /tmp/guardian_canary

[zfs]
dataset = tank/data
snapshot_prefix = guardian-auto
snapshot_interval = 300

[ml]
socket_path = /tmp/guardian_ml.sock
model_path = python/models/rf_model.pkl

[logging]
level = info
file = /var/log/guardian/events.jsonl
